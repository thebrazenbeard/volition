name: Workspace Startup Safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  editor-autostart-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Run Volition tests
        run: python -m pytest -q
      - name: Reject concealed folder-open execution
        run: python -m unittest discover -s tests -p test_workspace_startup_safety.py -v
